# Generator configuration for the `tiny` dataset: about 50 enquiries, small enough to review
# row by row (docs/SYNTHETIC_DATA_PLAN.md, section 6). Same assumptions as default.yaml, with
# higher enquiry, stale-event and wrong-reference rates so every case appears at least a few times.

extends: default.yaml

dataset_name: tiny

period:
  months: 1

world:
  n_customers: 8
  n_shipments: 30

tracking:
  stale_lag_share: 0.10

enquiries:
  base_rate_per_shipment: 4.0
  wrong_reference_share: 0.08

defects:
  enabled: false                 # tiny stays clean for row-by-row review; damaged sets come in step 6
