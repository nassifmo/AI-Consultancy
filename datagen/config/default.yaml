# Generator configuration for the `dev` dataset (also the base that other dataset configs extend).
# Sized so the planted agent_v2 - agent_v1 differences are detectable (see comparisons.*.mde_80
# in ground_truth/planted_effects.json): ~2,500 in-population enquiries per arm.
# ALL numeric behaviour values are ASSUMPTIONS for development, not facts about any company.
# They exist so we can plant known answers and test the evaluator. Tune them; do not cite them.

dataset_name: dev
seed: 42
service_rules_file: service_rules.yaml   # relative to this config file

period:
  start: "2026-01-01"
  months: 3
  timezone: "UTC"

world:
  n_customers: 1800
  n_shipments: 9000
  segment_shares: {large_account: 0.2, mid_market: 0.4, small: 0.4}
  containers_per_shipment: {min: 1, max: 4}
  transit_days: {min: 10, max: 40}
  ports: [LBBEY, AEJEA, SAJED, EGPSD, FRMRS, CNSHA, SGSIN, NLRTM]

operations:
  delay_mix:                     # share of shipments per delay class
    none: 0.70
    short: 0.20                  # under the escalation threshold
    long: 0.10                   # over the escalation threshold
  short_delay_hours: {min: 4, max: 20}
  long_delay_hours: {min: 30, max: 120}
  eta_revisions: {min: 0, max: 3}

tracking:
  recording_lag_minutes: {median: 30, p95: 240}   # event time -> recorded time
  stale_lag_share: 0.05                            # share of events recorded very late (creates stale-status cases)
  stale_lag_hours: {min: 6, max: 48}

enquiries:
  base_rate_per_shipment: 1.2    # expected baseline enquiries per shipment over its whole life
                                 # (only those inside the study period are kept)
  delay_rate_multiplier: 2.5     # enquiry rate multiplier after a delay/ETA change
  type_mix: {status: 0.55, delay: 0.30, documents: 0.10, other: 0.05}
  channel_mix: {voice: 0.5, email: 0.3, chat: 0.2}
  language_mix: {en: 0.70, ar: 0.15, fr: 0.15}
  min_days_between_contacts: 7   # independent contacts about one shipment are at least this far apart;
                                 # recontacts inside the repeat window come from layer 5 (handling quality)
  wrong_reference_share: 0.03    # customer gives a wrong/partial reference

design:
  type: randomized_split         # randomized_split | staged_rollout | before_after_confounded
  arms:                          # traffic shares must sum to 1; the first arm is the reference
    - {name: human_baseline, share: 0.34}
    - {name: agent_v1, share: 0.33}
    - {name: agent_v2, share: 0.33}
  rollout_date: null             # used by staged_rollout / before_after_confounded

human:
  queue_minutes: {median: 20.0, p95: 240.0}      # wait before a human picks up an enquiry or handoff
  handle_minutes: {median: 6.0, p95: 18.0}       # lognormal, active handling of one enquiry
  acw_minutes: {median: 1.5, p95: 5.0}
  error_rate: 0.03                               # gives a wrong ETA
  escalation_compliance: 0.95
  case_followup_compliance: 0.85                 # escalated case gets a customer update in time
  case_minutes: {median: 15.0, p95: 45.0}        # investigation effort on an escalated case
  followup_minutes: {median: 4.0, p95: 10.0}     # effort per customer update
  case_resolution_days: {median: 3.0, p95: 10.0} # escalated case open -> closed

agents:
  agent_v1:
    lookup_success: 0.95
    wrong_shipment_prob: 0.03
    stale_cache_prob: 0.10       # agent answers from an old snapshot
    escalation_compliance: 0.70
    unsupported_claim_prob: 0.05 # states a status/ETA not supported by any record
    handoff_prob: 0.15
    false_success_report_prob: 0.50   # of failed runs, share self-reported as "resolved"
    tokens_in: {median: 2500, p95: 6000}
    tokens_out: {median: 300, p95: 900}
    voice_seconds: {median: 150, p95: 420}
  agent_v2:                      # "integrator enhancement": fresher tracking data, stricter escalation
    lookup_success: 0.97
    wrong_shipment_prob: 0.005
    stale_cache_prob: 0.01
    escalation_compliance: 0.97
    unsupported_claim_prob: 0.01
    handoff_prob: 0.12
    false_success_report_prob: 0.50
    tokens_in: {median: 3200, p95: 7500}
    tokens_out: {median: 320, p95: 950}
    voice_seconds: {median: 140, p95: 400}

rescue:
  rescue_minutes: {median: 9.0, p95: 25.0}       # human time to fix a bad AI outcome
  detection_prob: 0.6                            # share of bad AI outcomes a human notices and fixes
  delay_hours: {min: 1, max: 24}                 # time from the bad answer to the human fix

follow_up:
  repeat_prob_if_failed: 0.55                    # customer contacts again about the same shipment
  repeat_prob_if_open: 0.20                      # escalated, case still open
  repeat_prob_if_resolved: 0.05

costs:
  currency: USD
  labor_rate_per_hour: 20.0
  setup_cost: 30000.0
  amortization_months: 24
  platform_fee_month: 1500.0
  maintenance_month: 1000.0
  unit_prices:
    voice_minutes: 0.10
    llm_tokens_in: 0.000003
    llm_tokens_out: 0.000015
    runs: 0.0
  staffing:
    generate: true
    baseline_headcount: 25

rendering:
  local_timezone: Asia/Beirut    # case and workforce systems export local time (offset included)
  local_time_files: [cases, case_history, agent_work]

defects:
  enabled: true
  rates:                         # share of rows affected in the target file
    duplicate_row: 0.01          # exact duplicate rows (export glitch)
    missing_field: 0.02          # blank optional field (claimed ETA/status, active time, case closed_at)
    missing_snapshot: 0.02       # share of shipments whose tracking history is missing from the export
    timezone_shift: 0.005        # local-time row exported without its UTC offset
    id_typo: 0.005               # enquiry reference mistyped in a work or case row
    orphan_record: 0.003         # work row for an enquiry not in the export
    retry_row: 0.01              # agent platform logs a failed technical retry before the real run
    late_record: 0.01            # row out of chronological order (arrived in a later batch)
    conflicting_closure: 0.005   # case table says closed, case history shows it reopened
